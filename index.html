<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#182449">
<meta name="description" content="Discover independent products from India’s founders. Exchange thoughtful feedback and test demand for your next idea.">
<title>PitchAdda · Founder feedback exchange</title>
<style>/* APP_STYLES */</style>
</head>
<body>
<header class="site-header"><div class="wrap header-inner">
<a class="brand" href="#discover" aria-label="PitchAdda home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>PitchAdda</a>
<nav aria-label="Main navigation"><a href="#discover">Discover</a><a href="#dashboard">Dashboard</a></nav>
<button class="header-cta" data-list><b aria-hidden="true">+</b> List a product</button>
</div></header>
<main class="wrap" id="page"><p role="status">Loading exchange…</p></main>
<footer class="wrap"><span>PitchAdda</span> Founder feedback exchange</footer>
<dialog aria-labelledby="dialog-title" id="modal"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="close" aria-label="Close dialog" onclick="modal.close()">×</button></div><div id="dialog-content"></div><p id="message" role="status"></p></dialog>
<template id="flight"><div class="flight-scene" aria-hidden="true">
  <div class="flight-grid"></div>
  <div class="flight-stage">
    <div class="flight-ring flight-ring-outer"></div>
    <div class="flight-ring flight-ring-inner"></div>
    <div class="flight-orbit"><i></i></div>
    <div class="flight-pack">
      <div class="flight-sheet flight-sheet-back"></div>
      <div class="flight-sheet flight-sheet-mid"></div>
      <div class="flight-sheet flight-sheet-face">
        <div class="flight-dots"><i></i><i></i><i></i></div>
        <div class="flight-stars">★★★★★</div>
        <div class="flight-lines"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="flight-plane flight-plane-blue"><i></i><i></i><i></i><i></i></div>
    <div class="flight-plane flight-plane-orange"><i></i><i></i><i></i><i></i></div>
    <span class="flight-glint flight-glint-one"></span>
    <span class="flight-glint flight-glint-two"></span>
  </div>
</div>
</template>
<template id="covers"><div class="cover cv-scene cv-ledger" aria-hidden="true"><div class="cv-book"><span class="cv-strap"></span></div></div>
<div class="cover cv-scene cv-tiffin" aria-hidden="true"><div class="cv-stack"><span class="cv-bowl"></span><span class="cv-bowl"></span><span class="cv-bowl"></span><span class="cv-lid"></span><span class="cv-handle"></span><span class="cv-clasp"></span></div></div>
<div class="cover cv-scene cv-sheets" aria-hidden="true"><div class="cv-paper"><span class="cv-leaf"></span><span class="cv-leaf"></span><span class="cv-leaf"></span></div></div></template>
<script>/* APP_SCRIPT */</script>
</body></html>
