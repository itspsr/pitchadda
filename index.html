<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PitchAdda · Founder feedback exchange</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fc;color:#172246;font:16px/1.5 Inter,Arial,sans-serif}header,main{max-width:1190px;margin:auto;padding:0 5%}header{display:flex;align-items:center;gap:28px;height:80px}.brand{font-size:26px;font-weight:850;letter-spacing:-1.7px;margin-right:auto}.brand b{color:#6957ed}button,a{font:inherit;cursor:pointer;color:inherit}button{border:0;border-radius:9px;background:#ebe9ff;padding:10px 15px;font-weight:650}.primary{background:#5947db;color:white}nav{display:flex;gap:8px}nav button{background:transparent}.hero{background:#182655;color:white;border-radius:20px;padding:42px;position:relative;overflow:hidden;isolation:isolate}.hero:after{content:'';position:absolute;inset:-120px -80px -140px 56%;z-index:-1;background:repeating-radial-gradient(ellipse at 90% 40%,transparent 0 21px,#a29fff70 22px 23px,transparent 24px 33px);transform:rotate(-19deg)}.eyebrow,small{font-size:13px;font-weight:750;letter-spacing:.07em}.eyebrow{color:#c7c4ff}.hero h1{font-size:clamp(36px,5.2vw,67px);line-height:1.02;letter-spacing:-.055em;margin:18px 0}.hero p{max-width:470px;color:#e4e5fa}.hero button{background:#d1f696}.bar,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.bar{margin:30px 0 14px}.bar h2{letter-spacing:-1px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{background:white;border:1px solid #dce0ec;border-radius:15px;padding:21px}.card{display:flex;flex-direction:column}.art{height:101px;border-radius:9px;display:grid;place-items:center;font-size:46px;font-weight:900;background:var(--bg);color:var(--ink);background-image:repeating-linear-gradient(135deg,transparent 0 15px,#fff3 16px 17px)}.card h3{margin:14px 0 3px;font-size:23px;letter-spacing:-1px}.card p{color:#505b76;flex:1;margin:4px 0 18px}.tag{font-size:13px;font-weight:650;color:#645892}.meta{margin-top:12px}.panel{margin:16px 0}dialog{border:0;border-radius:16px;width:min(520px,94vw);max-height:90vh;color:inherit;padding:24px}dialog::backdrop{background:#141a38aa}label{display:block;margin:12px 0;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #bbc0ce;border-radius:6px;font:inherit}form button{margin-top:8px}footer{margin:40px 0;color:#67708b}#msg{color:#9a3027}.card button{align-self:flex-start}a{color:#5142cd}@media(max-width:760px){header{gap:4px;height:auto;min-height:74px;flex-wrap:wrap}nav button{padding:7px}.grid{grid-template-columns:1fr}.hero{padding:25px}.hero:after{opacity:.5}.bar{flex-wrap:wrap}}
</style><header><div class="brand"><b>▧</b> PitchAdda</div><nav><button onclick="show('discover')">Discover</button><button onclick="show('dashboard')">Dashboard</button></nav></header><main><div id="page">Loading exchange…</div><footer>PitchAdda · Built for India's founder community</footer></main><dialog id="modal"><div class="row"><h2 id="title"></h2><button aria-label="Close" onclick="modal.close()">×</button></div><div id="body"></div><p role="status" id="msg"></p></dialog><script>
let state,view='discover';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function sync(){let r=await fetch('/api');if(!r.ok)throw Error('The exchange could not load. Please refresh.');state=await r.json();show(view)}
function show(v){view=v;if(!state)return;let cards=state.products.filter(p=>v==='discover'||p.mine).map((p,i)=>'<article class="card"><div class="art" style="--bg:'+['#d4f1be','#ffd7be','#dfd9ff'][i%3]+';--ink:'+['#346b43','#a95130','#6151ae'][i%3]+'">'+['◈','✳','▥'][i%3]+'</div><div class="meta tag">'+esc(p.category)+(p.seed?' · Practice brief':'')+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p.description)+'</p><button onclick="detail('+p.id+')">'+(p.mine?'View feedback':p.done?'View product':'Review product')+'</button></article>').join('');page.innerHTML=(v==='discover'?'<section class="hero"><div class="eyebrow">FOUNDER FEEDBACK EXCHANGE</div><h1>Fresh eyes on<br>your next big idea.</h1><p>Explore what founders are building. Give three thoughtful reviews to unlock a listing of your own.</p><button onclick="listing()">List your product</button></section>':'<h1>Founder dashboard</h1><div class="panel row"><strong>'+Math.min(state.count,3)+' of 3 reviews completed</strong><button class="primary" onclick="listing()">List your product</button></div>')+'<div class="bar"><h2>'+(v==='discover'?'Discover products':'Your products')+'</h2><span>'+ (v==='discover'?state.products.length+' products':'')+'</span></div><div class="grid">'+cards+'</div>'+(!cards?'<p>Your listings and feedback will appear here.</p>':'')}
function openBox(t,s){title.textContent=t;body.innerHTML=s;msg.textContent='';if(!modal.open)modal.showModal()}function field(n,t,type='text',max=300){return '<label>'+esc(t)+'<input required name="'+n+'" type="'+type+'" maxlength="'+max+'"></label>'}
function listing(){if(state.count<3){openBox('Unlock your listing','<p>Review '+(3-state.count)+' more distinct products to publish your own brief.</p><button onclick="modal.close();show(\'discover\')">Explore products</button>');return}openBox('List your product','<form onsubmit="save(event,\'list\')">'+field('name','Product name','text',80)+field('url','Website URL','url')+field('category','Category','text',40)+field('description','One-line description')+field('q1','First question for reviewers')+field('q2','Second question for reviewers')+'<label>Third question (optional)<input name="q3" maxlength="300"></label><button class="primary">Publish listing</button></form>')}
function detail(id){let p=state.products.find(x=>x.id===id);openBox(p.name,'<p>'+esc(p.description)+'</p>'+(p.url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(p.url)+'">Visit product website ↗</a>':'<p class="tag">Practice concept · Review the idea described above.</p>')+(p.mine?'<div class="panel"><strong>'+p.total+' reviews · '+(p.avg??'—')+' / 5 · '+p.waits+' on waitlist</strong></div>'+p.feedback.map(f=>'<p>'+esc(f.note)+'<br><small>'+esc(f.intent)+'</small></p>'+JSON.parse(f.answers).map((a,i)=>'<p><b>'+esc(p.questions[i])+'</b><br>'+esc(a)+'</p>').join('')).join(''):'<p><button onclick="join('+id+')" '+(p.joined?'disabled':'')+'>'+(p.joined?'Joined waitlist':'Join waitlist')+'</button></p>'+(p.done?'<p>Your review has been recorded.</p>':'<form onsubmit="save(event,\'review\','+id+')">'+p.questions.map((q,i)=>field('a'+i,q)).join('')+'<label>Overall rating<select name="rating">'+[5,4,3,2,1].map(x=>'<option>'+x+'</option>').join('')+'</select></label>'+field('note','One-line feedback')+'<label>Would you use it?<select name="intent"><option>Would use</option><option>Would pay</option><option>Would pass</option></select></label><button class="primary">Submit review</button></form>')))}
async function post(data){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());await sync()}async function join(id){try{await post({action:'join',id});detail(id)}catch(e){msg.textContent=e.message}}async function save(e,action,id){e.preventDefault();try{await post({...Object.fromEntries(new FormData(e.target)),action,id});modal.close();if(action==='list')show('dashboard')}catch(err){msg.textContent=err.message}}sync().catch(e=>page.textContent=e.message)
</script></html>
